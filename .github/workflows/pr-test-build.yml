name: pr-test-build

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Routing policy regression tests
        run: >-
          go test ./sdk/cliproxy/auth ./sdk/api/handlers ./internal/api/handlers/management
          ./internal/config ./internal/runtime/executor/helps
          -run 'TrafficShaping|QuotaReserve|CreditExhausted|CreditPark|CreditResetDay|CodexOverload|LegacyCodexModel|ClaudeQuota|ChainedCPAPoolCooldown|Issue7017TrustedRetryAfter'
          -count=1 -v
      - name: Build
        run: |
          go build -o test-output ./cmd/server
          rm -f test-output
